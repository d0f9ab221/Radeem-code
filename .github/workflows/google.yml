name: Automatic Google AI Studio Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Latest Files from AI Studio
        env:
          GEMINI_API_KEY: ${{ secrets.API_KEY }}
        run: |
          # API endpoint aur structure ko v1beta ke mutabik correct kiya gaya hai
          curl -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}" \
          -H "Content-Type: application/json" \
          -d '{"contents": [{"parts":[{"text": "Return a valid JSON object containing the latest structured backup of my development files and project code base."}]}]}' > project_data.json

      - name: Automatically Commit and Deploy
        run: |
          git config --global user.name "AI Studio Auto Deployer"
          git config --global user.email "autodeploy@github.com"
          git add .
          git commit -m "Automatic Deploy from Google AI Studio [Skip CI]" || exit 0
          git push origin main
