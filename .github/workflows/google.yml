name: Automatic Google AI Studio Sync

on:
  schedule:
    - cron: '*/5 * * * *' # Yeh har 5 minute baad khud hi check karne ki koshish karega
  workflow_dispatch: # Isse aap jab chahein single click se turant deploy kar sakte hain

jobs:
  auto_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch Latest Files from AI Studio
        env:
          GEMINI_API_KEY: ${{ secrets.API_KEY }} # Jo secret name aapne rakha hai
        run: |
          # AI Studio se structural response fetch karne ki command
          curl -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}" \
          -H "Content-Type: application/json" \
          -d '{"contents": [{"parts":[{"text": "Export my latest project code as plain structured files"}]}]}' > project_data.json

      - name: Automatically Commit and Deploy
        run: |
          git config --global user.name "AI Studio Auto Deployer"
          git config --global user.email "autodeploy@github.com"
          git add .
          git commit -m "Automatic Deploy from Google AI Studio [Skip CI]" || exit 0
          git push origin main
